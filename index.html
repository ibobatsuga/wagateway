<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATSUGA - WhatsApp API Gateway & AI Automation Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (SaaS Vibe) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Chart.js for Realtime Data Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts (Plus Jakarta Sans for ultra-modern SaaS look) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46'
                        },
                        brand: {
                            bg: '#f4f4f8',
                            yellow: '#fde047',
                            yellowLight: '#fef9c3',
                            greenBg: '#059669'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f4f8;
            color: #1e293b;
        }

        .card-white {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02), 0 1px 2px 0 rgba(0, 0, 0, 0.02);
            border-radius: 1rem;
        }

        .card-white-hover:hover {
            border-color: #cbd5e1;
            box-shadow: 0 4px 12px -2px rgba(5, 150, 105, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }

        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(1000%);
            }
        }

        .animate-scanline {
            animation: scanline 2.5s linear infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .node-glow {
            animation: pulse-glow 1.5s infinite ease-in-out;
        }
    </style>
</head>

<body
    class="m-0 p-0 flex justify-center bg-[#f4f4f8] text-slate-800 overflow-hidden antialiased selection:bg-emerald-200">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-[#f4f4f8] px-4 transition-all duration-300">
        <div
            class="card-white w-full max-w-md p-8 rounded-3xl shadow-xl relative overflow-hidden bg-white border border-slate-200/80">
            <!-- Decorative blur blobs -->
            <div
                class="absolute -top-20 -right-20 w-48 h-48 bg-emerald-200/60 rounded-full blur-3xl pointer-events-none">
            </div>
            <div
                class="absolute -bottom-20 -left-20 w-48 h-48 bg-yellow-200/60 rounded-full blur-3xl pointer-events-none">
            </div>

            <div class="flex items-center gap-3 mb-6 relative z-10">
                <div
                    class="w-11 h-11 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-lg shadow-emerald-600/30">
                    <i class="ph-bold ph-whatsapp-logo text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">ATSUGA</h1>
                    <p class="text-xs text-emerald-600 font-bold uppercase tracking-wider">WhatsApp API & AI Gateway</p>
                </div>
            </div>

            <h2 class="text-xl font-bold text-slate-900 mb-1">Selamat Datang</h2>
            <p class="text-xs text-slate-500 mb-4">Masuk ke workspace Anda sebagai Super Admin / Admin</p>

            <!-- Quick Credential Helper Pill -->
            <div
                class="mb-5 p-3 rounded-2xl bg-slate-50 border border-slate-200 flex justify-between items-center text-xs">
                <div>
                    <span class="block font-bold text-slate-800 text-[11px]">Super Admin: <code
                            class="text-purple-700">superadmin</code></span>
                    <span class="block font-medium text-slate-500 text-[10px]">Admin 1-20: <code
                            class="text-emerald-700">admin1</code> ... <code
                            class="text-emerald-700">admin20</code></span>
                </div>
                <button type="button" onclick="openModal('viewAccounts')"
                    class="text-xs text-emerald-600 font-bold hover:underline bg-emerald-50 px-2.5 py-1.5 rounded-lg border border-emerald-200">
                    Daftar Akun
                </button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4 relative z-10">
                <div>
                    <label
                        class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Username</label>
                    <input type="text" id="username"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 outline-none transition-all placeholder-slate-400"
                        placeholder="superadmin atau admin1" value="superadmin" required>
                </div>
                <div>
                    <label
                        class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wider">Password</label>
                    <input type="password" id="password"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-900 focus:ring-2 focus:ring-emerald-600/20 focus:border-emerald-600 outline-none transition-all placeholder-slate-400"
                        placeholder="••••••••" value="SuperAdminPass2026!" required>
                </div>
                <button type="submit" id="loginBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl px-4 py-3.5 text-sm transition-all mt-6 flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30">
                    <span>Sign In to Workspace</span>
                    <i class="ph-bold ph-arrow-right text-base"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-100 pt-4">
                <span>Enterprise Baileys v6.7 & Multi-Admin RBAC Role</span>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="appScreen"
        class="w-full h-screen flex overflow-hidden bg-[#f4f4f8] relative opacity-0 pointer-events-none transition-opacity duration-300 hidden">

        <!-- SIDEBAR -->
        <div id="sidebarOverlay" class="bg-slate-900/40 fixed inset-0 z-40 md:hidden hidden backdrop-blur-sm"
            onclick="toggleSidebar()"></div>
        <aside id="sidebar"
            class="fixed md:relative inset-y-0 left-0 z-50 w-64 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col h-full bg-white border-r border-slate-200/80 shadow-sm">

            <!-- Brand & Top Button -->
            <div class="p-6 border-b border-slate-100 flex-none space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-600/30">
                            <i class="ph-bold ph-whatsapp-logo text-xl"></i>
                        </div>
                        <div>
                            <span
                                class="text-base font-extrabold text-slate-900 tracking-tight block leading-none">ATSUGA</span>
                            <span class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Gateway
                                v2.4</span>
                        </div>
                    </div>
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-700">
                        <i class="ph ph-x text-lg"></i>
                    </button>
                </div>

                <!-- Create Action Pill Button -->
                <button onclick="openModal('addSession')"
                    class="w-full bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 border border-slate-200 hover:border-emerald-300 rounded-xl py-2.5 px-3 text-xs font-bold transition-all flex items-center justify-center gap-2">
                    <i class="ph-bold ph-plus-circle text-base text-emerald-600"></i>
                    <span>Connect Workspace</span>
                </button>
            </div>

            <!-- Navigation Menu -->
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1.5 hide-scroll" id="navMenu">
                <!-- Injected via JS -->
            </nav>

            <!-- Sidebar Upgrade Card -->
            <div class="px-4 py-3 flex-none">
                <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-center">
                    <div
                        class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center mx-auto mb-2 shadow-md shadow-emerald-500/30">
                        <i class="ph-bold ph-crown text-sm"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-900">Production Mode</p>
                    <p class="text-[10px] text-slate-500 mt-0.5 mb-3">Real Gateway Active</p>
                    <button onclick="setMenu('billing')"
                        class="w-full border-2 border-emerald-600 text-emerald-700 hover:bg-emerald-600 hover:text-white font-bold rounded-xl py-1.5 text-xs transition-all">
                        Server Health
                    </button>
                </div>
            </div>

            <!-- User Profile Bottom Bar -->
            <div class="p-3 border-t border-slate-100 flex-none bg-white" id="sidebarUserProfile">
                <!-- Injected dynamically via renderUserProfile() -->
            </div>
        </aside>

        <!-- RIGHT CONTENT WRAPPER -->
        <main class="flex-1 flex flex-col overflow-hidden relative w-full bg-[#f4f4f8]">
            <!-- Top Header Bar -->
            <header
                class="h-16 flex-none bg-white border-b border-slate-200/80 flex items-center justify-between px-4 sm:px-8 z-30 sticky top-0 shadow-sm">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()"
                        class="md:hidden w-9 h-9 flex items-center justify-center text-slate-600 hover:text-slate-900 rounded-xl bg-slate-100">
                        <i class="ph ph-list text-xl"></i>
                    </button>
                    <!-- Quick Search Input Bar -->
                    <div
                        class="hidden sm:flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-1.5 w-72 focus-within:border-emerald-600 focus-within:bg-white transition-all">
                        <i class="ph-bold ph-magnifying-glass text-slate-400 text-sm"></i>
                        <input type="text" placeholder="Ketik pencarian cepat..."
                            class="bg-transparent text-xs text-slate-800 outline-none w-full placeholder-slate-400">
                    </div>
                </div>

                <!-- Right Header Actions (Dynamically renders Reset State ONLY for Super Admin) -->
                <div class="flex items-center gap-3" id="headerRightActions">
                    <!-- Injected dynamically via renderHeaderActions() -->
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div class="flex-1 overflow-y-auto p-4 lg:p-8 pb-safe relative" id="mainContent">
                <!-- Injected via JS -->
            </div>
        </main>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast"
        class="fixed top-4 right-4 z-[200] transform transition-all duration-300 translate-y-[-150%] opacity-0 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl bg-white text-sm font-medium max-w-sm border border-slate-200">
        <i id="toastIcon" class="text-xl"></i>
        <span id="toastMsg" class="text-slate-800 text-xs sm:text-sm font-semibold"></span>
    </div>

    <!-- CENTRAL MODAL OVERLAY -->
    <div id="modalOverlay"
        class="fixed inset-0 z-[150] bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-all duration-200">
        <div id="modalContent"
            class="bg-white w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-200 border border-slate-200">
            <!-- Injected via JS -->
        </div>
    </div>

    <script>
        /* ================= Users Credentials Database (Super Admin + 20 Admins) ================= */
        const usersDB = [
            { username: 'superadmin', password: 'SuperAdminPass2026!', name: 'Super Admin', email: 'superadmin@atsuga.io', role: 'superadmin' },
            { username: 'admin1', password: 'AdminPass101!', name: 'Admin One', email: 'admin1@atsuga.io', role: 'admin' },
            { username: 'admin2', password: 'AdminPass102!', name: 'Admin Two', email: 'admin2@atsuga.io', role: 'admin' },
            { username: 'admin3', password: 'AdminPass103!', name: 'Admin Three', email: 'admin3@atsuga.io', role: 'admin' },
            { username: 'admin4', password: 'AdminPass104!', name: 'Admin Four', email: 'admin4@atsuga.io', role: 'admin' },
            { username: 'admin5', password: 'AdminPass105!', name: 'Admin Five', email: 'admin5@atsuga.io', role: 'admin' },
            { username: 'admin6', password: 'AdminPass106!', name: 'Admin Six', email: 'admin6@atsuga.io', role: 'admin' },
            { username: 'admin7', password: 'AdminPass107!', name: 'Admin Seven', email: 'admin7@atsuga.io', role: 'admin' },
            { username: 'admin8', password: 'AdminPass108!', name: 'Admin Eight', email: 'admin8@atsuga.io', role: 'admin' },
            { username: 'admin9', password: 'AdminPass109!', name: 'Admin Nine', email: 'admin9@atsuga.io', role: 'admin' },
            { username: 'admin10', password: 'AdminPass110!', name: 'Admin Ten', email: 'admin10@atsuga.io', role: 'admin' },
            { username: 'admin11', password: 'AdminPass111!', name: 'Admin Eleven', email: 'admin11@atsuga.io', role: 'admin' },
            { username: 'admin12', password: 'AdminPass112!', name: 'Admin Twelve', email: 'admin12@atsuga.io', role: 'admin' },
            { username: 'admin13', password: 'AdminPass113!', name: 'Admin Thirteen', email: 'admin13@atsuga.io', role: 'admin' },
            { username: 'admin14', password: 'AdminPass114!', name: 'Admin Fourteen', email: 'admin14@atsuga.io', role: 'admin' },
            { username: 'admin15', password: 'AdminPass115!', name: 'Admin Fifteen', email: 'admin15@atsuga.io', role: 'admin' },
            { username: 'admin16', password: 'AdminPass116!', name: 'Admin Sixteen', email: 'admin16@atsuga.io', role: 'admin' },
            { username: 'admin17', password: 'AdminPass117!', name: 'Admin Seventeen', email: 'admin17@atsuga.io', role: 'admin' },
            { username: 'admin18', password: 'AdminPass118!', name: 'Admin Eighteen', email: 'admin18@atsuga.io', role: 'admin' },
            { username: 'admin19', password: 'AdminPass119!', name: 'Admin Nineteen', email: 'admin19@atsuga.io', role: 'admin' },
            { username: 'admin20', password: 'AdminPass120!', name: 'Admin Twenty', email: 'admin20@atsuga.io', role: 'admin' }
        ];

        /* ================= Clean Production State ================= */
        const cleanState = {
            activeMenu: 'dashboard',
            stats: { totalSessions: 0, messagesToday: 0, successRate: "100%", apiCalls: 0 },
            sessions: [],
            apikeys: [],
            webhooks: [],
            contacts: [],
            broadcasts: [],
            integrations: [],
            plugins: [],
            automationNodes: [
                { id: 'n1', type: 'trigger', title: 'Pesan Masuk (Trigger)', desc: 'Saat pesan WA baru diterima', icon: 'ph-lightning', color: 'emerald' },
                { id: 'n2', type: 'condition', title: 'Cek Kata Kunci', desc: 'Contains: "harga", "promo", "order"', icon: 'ph-git-branch', color: 'blue' },
                { id: 'n3', type: 'ai', title: 'AI Agent Auto-Response', desc: 'OpenAI gpt-4o dengan prompt CS', icon: 'ph-robot', color: 'emerald' },
                { id: 'n4', type: 'sheets', title: 'Simpan ke Google Sheets', desc: 'Log prospek ke spreadsheet Leads', icon: 'ph-table', color: 'emerald' }
            ],
            aiConfig: {
                provider: 'openai',
                model: 'gpt-4o',
                apiKey: '',
                systemPrompt: 'Kamu adalah ATSUGA Bot, asisten layanan pelanggan yang sangat ramah, profesional, dan cepat tanggap. Selalu jawab pertanyaan pelanggan dalam Bahasa Indonesia yang sopan.',
                temperature: 0.7
            },
            sandboxChat: []
        };

        let state = loadState();
        let chartInstance = null;

        function getCurrentUser() {
            try {
                const u = localStorage.getItem('atsuga_user');
                if (u) return JSON.parse(u);
            } catch (e) { }
            return usersDB[0]; // fallback to superadmin
        }

        function loadState() {
            try {
                const saved = localStorage.getItem('atsuga_state_prod_v1');
                if (saved) return JSON.parse(saved);
            } catch (e) {
                console.error('Failed to parse state:', e);
            }
            return JSON.parse(JSON.stringify(cleanState));
        }

        function saveState() {
            localStorage.setItem('atsuga_state_prod_v1', JSON.stringify(state));
        }

        function resetToCleanState() {
            const currentUser = getCurrentUser();
            if (currentUser.role !== 'superadmin') {
                showToast('Hanya Super Admin yang diizinkan melakukan Reset State!', 'error');
                return;
            }

            if (confirm('Apakah Anda yakin ingin mengosongkan seluruh data workspace untuk membuat instalasi bersih? (Tindakan ini hanya dapat dilakukan oleh Super Admin)')) {
                state = JSON.parse(JSON.stringify(cleanState));
                saveState();
                renderContent(state.activeMenu);
                showToast('Data workspace berhasil dibersihkan (Clean Production State)', 'success');
            }
        }

        const menus = [
            { id: 'dashboard', label: 'Home Dashboard', icon: 'ph-house-line' },
            { id: 'sessions', label: 'WhatsApp Sessions', icon: 'ph-device-mobile' },
            { id: 'plugins', label: 'Plugin Hub', icon: 'ph-cards' },
            { id: 'sheets', label: 'Bot Integrations', icon: 'ph-plugs-connected' },
            { id: 'api', label: 'API Keys', icon: 'ph-key' },
            { id: 'webhook', label: 'Webhook Logs', icon: 'ph-plugs' },
            { id: 'contacts', label: 'Contacts Database', icon: 'ph-users' },
            { id: 'broadcast', label: 'Campaign Broadcast', icon: 'ph-paper-plane-tilt' },
            { type: 'divider' },
            { id: 'automation', label: 'Automation Builder', icon: 'ph-git-merge' },
            { id: 'ai', label: 'AI Configurator', icon: 'ph-robot' },
            { id: 'billing', label: 'Billing & Usage', icon: 'ph-credit-card' }
        ];

        /* ================= Core Functions ================= */
        function initApp() {
            renderSidebar();
            const isAuth = localStorage.getItem('atsuga_auth') === 'true';
            const loginScreen = document.getElementById('loginScreen');
            const appScreen = document.getElementById('appScreen');

            if (isAuth) {
                showApp();
            } else {
                if (loginScreen) {
                    loginScreen.style.display = 'flex';
                    loginScreen.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                }
                if (appScreen) {
                    appScreen.style.display = 'none';
                    appScreen.classList.add('hidden', 'opacity-0', 'pointer-events-none');
                }
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim().toLowerCase();
            const p = document.getElementById('password').value.trim();

            const foundUser = usersDB.find(user => user.username.toLowerCase() === u && user.password === p);

            if (foundUser) {
                localStorage.setItem('atsuga_auth', 'true');
                localStorage.setItem('atsuga_user', JSON.stringify(foundUser));
                showToast(`Selamat Datang, ${foundUser.name} (${foundUser.role === 'superadmin' ? 'Super Admin' : 'Admin'})!`, 'success');
                showApp();
            } else {
                showToast('Username atau Password salah! Periksa daftar akun di CREDENTIALS.md.', 'error');
            }
        }

        function showApp() {
            const loginScreen = document.getElementById('loginScreen');
            const appScreen = document.getElementById('appScreen');

            if (loginScreen) {
                loginScreen.style.display = 'none';
                loginScreen.classList.add('hidden', 'opacity-0', 'pointer-events-none');
            }

            if (appScreen) {
                appScreen.style.display = 'flex';
                appScreen.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            }

            const btn = document.getElementById('loginBtn');
            if (btn) btn.innerHTML = `<span>Sign In to Workspace</span><i class="ph-bold ph-arrow-right text-base"></i>`;

            renderHeaderActions();
            renderUserProfile();
            renderContent(state.activeMenu);
        }

        function handleLogout() {
            localStorage.removeItem('atsuga_auth');
            localStorage.removeItem('atsuga_user');

            const loginScreen = document.getElementById('loginScreen');
            const appScreen = document.getElementById('appScreen');

            if (appScreen) {
                appScreen.style.display = 'none';
                appScreen.classList.add('hidden', 'opacity-0', 'pointer-events-none');
            }

            if (loginScreen) {
                loginScreen.style.display = 'flex';
                loginScreen.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            }

            const btn = document.getElementById('loginBtn');
            if (btn) btn.innerHTML = `<span>Sign In to Workspace</span><i class="ph-bold ph-arrow-right text-base"></i>`;

            showToast('Anda telah logout dari workspace', 'info');
        }

        function renderHeaderActions() {
            const currentUser = getCurrentUser();
            const container = document.getElementById('headerRightActions');
            if (!container) return;

            let html = '';

            // Render Reset State Button ONLY if Super Admin
            if (currentUser.role === 'superadmin') {
                html += `
                    <button onclick="resetToCleanState()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-3 py-1.5 rounded-xl transition-all border border-slate-200 flex items-center gap-1">
                        <i class="ph-bold ph-arrows-counter-clockwise text-purple-600"></i>
                        <span>Reset State</span>
                    </button>
                `;
            }

            html += `
                <button onclick="showToast('Gateway System Ready & Healthy', 'success')" class="w-9 h-9 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-600 hover:text-emerald-600 transition-colors relative">
                    <i class="ph-bold ph-bell text-base"></i>
                    <span class="w-2 h-2 rounded-full bg-emerald-600 absolute top-2 right-2 ring-2 ring-white"></span>
                </button>
                
                <button onclick="openModal('addSession')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition-all shadow-md shadow-emerald-600/25 flex items-center gap-2">
                    <i class="ph-bold ph-record text-sm"></i>
                    <span>+ Connect WA</span>
                </button>
            `;

            container.innerHTML = html;
        }

        function renderUserProfile() {
            const currentUser = getCurrentUser();
            const container = document.getElementById('sidebarUserProfile');
            if (!container) return;

            const initials = currentUser.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            const isSuper = currentUser.role === 'superadmin';

            container.innerHTML = `
                <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-slate-50 transition-colors group cursor-pointer" onclick="handleLogout()">
                    <div class="w-9 h-9 rounded-full ${isSuper ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200'} border flex items-center justify-center font-bold text-xs">
                        ${initials}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebarOverlay');
            sb.classList.toggle('-translate-x-full');
            ov.classList.toggle('hidden');
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').innerText = msg;

            let iconClass = 'ph-fill ph-info text-blue-500';
            let borderClass = 'border-emerald-100 shadow-emerald-500/10';

            if (type === 'success') {
                iconClass = 'ph-fill ph-check-circle text-emerald-500';
            } else if (type === 'error') {
                iconClass = 'ph-fill ph-warning-circle text-red-500';
            }

            toast.className = `fixed top-4 right-4 z-[200] transform transition-all duration-300 flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl bg-white text-sm font-medium max-w-sm border ${borderClass}`;
            icon.className = iconClass;

            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-[-150%]', 'opacity-0'), 3200);
        }

        function setMenu(id) {
            state.activeMenu = id;
            saveState();
            renderSidebar();
            renderContent(id);
            if (window.innerWidth < 768) {
                const sb = document.getElementById('sidebar');
                const ov = document.getElementById('sidebarOverlay');
                if (sb && !sb.classList.contains('-translate-x-full')) {
                    sb.classList.add('-translate-x-full');
                    ov.classList.add('hidden');
                }
            }
        }

                return `

                        <i class="${m.icon} text-lg ${state.activeMenu === m.id ? 'text-white' : 'text-slate-400'}"></i>

        function handleSendBroadcast(e) {
            e.preventDefault();

            const newBc = {
                id: 'b_' + Date.now().toString().slice(-4),
                name: title,
                target: target,
                sent: 1,
                total: state.contacts.length || 10,
                status: 'In Progress',

            };
            state.broadcasts.unshift(newBc);
            state.stats.messagesToday += newBc.total;
            saveState();
            renderContent('broadcast');
            showToast('Campaign Broadcast diluncurkan!', 'success');

            // Progress loop
            let interval = setInterval(() => {
                const bc = state.broadcasts.find(b => b.id === newBc.id);
                if (bc && bc.sent < bc.total) {
                    bc.sent += Math.floor(Math.random() * 3 + 1);
                    if (bc.sent >= bc.total) {
                        bc.sent = bc.total;
                        bc.status = 'Completed';
                        clearInterval(interval);
                    }
                    saveState();
                    if (state.activeMenu === 'broadcast') renderContent('broadcast');
                } else {
                    clearInterval(interval);
                }
            }, 1000);
        }

        async function handleSaveSheetsConfig(e, sessionId) {
            if (e) e.preventDefault();
            const url = document.getElementById('sheetUrl')?.value?.trim();
            const sheetName = document.getElementById('sheetTab')?.value?.trim() || 'WhatsApp_Leads';
            const triggersRaw = document.getElementById('sheetTriggers')?.value || '';
            const triggers = triggersRaw.split(',').map(t => t.trim()).filter(Boolean);
            const autoSync = document.getElementById('autoSyncCheck')?.checked ?? true;

            if (!url) { showToast('URL Apps Script wajib diisi', 'error'); return; }
            if (!sessionId) { showToast('Tidak ada sesi WA dipilih', 'error'); return; }

            const session = (state.sessions || []).find(s => s.id === sessionId);
            const existingIntg = (state.integrations || []).find(i => i.sessionId === sessionId);

            const payload = {
                sessionId,
                name: `Sheets — ${session?.phone || session?.name || sessionId}`,
                description: `Integrasi Google Sheets untuk ${session?.phone || sessionId}`,
                appsScriptUrl: url,
                sheetName,
                triggers,
                matchMode: triggers.length === 0 ? 'catchAll' : 'startsWith',
                autoSync,
                enabled: true
            };

            try {
                const method = existingIntg ? 'PUT' : 'POST';
                const endpoint = existingIntg ? `/api/integrations/${existingIntg.id}` : '/api/integrations';
                const res = await fetch(endpoint, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Konfigurasi Google Sheets disimpan!', 'success');
                    await syncIntegrationsFromServer();
                    renderSheetsPage(sessionId);
                } else {
                    showToast('Gagal: ' + data.error, 'error');
                }
            } catch (err) {
                showToast('Error: ' + err.message, 'error');
            }
        }

            if (!integrationId) {
                showToast('Simpan konfigurasi terlebih dahulu sebelum menguji koneksi', 'error');
                return;

            showToast('Menghubungkan ke Google Apps Script...', 'info');
            try {
                const res = await fetch(`/api/integrations/${integrationId}/test`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(`✅ Koneksi Sukses ke Google Sheets! Respons: "${data.response?.substring(0, 80)}"`, 'success');
                    await syncIntegrationsFromServer();
                    renderSheetsPage(sheetsSelectedSessionId);
                } else {
                    showToast(`❌ Test gagal: ${data.error}`, 'error');
                }
            } catch (err) {
                showToast('Error koneksi: ' + err.message, 'error');
            }
        }

        async function togglePluginStatus(pluginId, enabled) {
            try {
                const res = await fetch(`/api/plugins/${pluginId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`Plugin "${pluginId}" ${enabled ? 'diaktifkan' : 'dinonaktifkan'}`, 'success');
                    await syncPluginsFromServer();
                    renderPluginsPage();
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        async function saveN8nPluginConfig() {
            const webhookUrl = document.getElementById('n8n_webhookUrl')?.value?.trim();
            const secretKey = document.getElementById('n8n_secretKey')?.value?.trim();
            try {
                const res = await fetch('/api/plugins/n8n-webhook', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: { webhookUrl, secretKey } })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Konfigurasi n8n Plugin disimpan!', 'success');
                    await syncPluginsFromServer();
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        async function saveAiPluginConfig() {
            const provider = document.getElementById('ai_provider')?.value;
            const model = document.getElementById('ai_model')?.value?.trim();
            const apiKey = document.getElementById('ai_apiKey')?.value?.trim();
            const systemPrompt = document.getElementById('ai_systemPrompt')?.value?.trim();

            try {
                const res = await fetch('/api/plugins/ai-agent', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ config: { provider, model, apiKey, systemPrompt } })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Konfigurasi AI CS Agent disimpan!', 'success');
                    await syncPluginsFromServer();
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        async function handleSendTestMedia() {
            const to = document.getElementById('media_to')?.value?.trim();
            const mediaUrl = document.getElementById('media_url')?.value?.trim();
            const caption = document.getElementById('media_caption')?.value?.trim();

            if (!to || !mediaUrl) {
                showToast('Isi nomor WA dan Media URL terlebih dahulu', 'error');
                return;
            }

            showToast('Mengirim berkas media...', 'info');
            try {
                const res = await fetch('/api/send-media', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to, mediaUrl, caption, type: mediaUrl.endsWith('.pdf') ? 'document' : 'image' })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`✅ Berkas media berhasil terkirim ke ${data.to}!`, 'success');
                } else {
                    showToast('Gagal kirim media: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        async function testPlugin(pluginId) {
            showToast(`Menguji plugin ${pluginId}...`, 'info');
            try {
                const res = await fetch(`/api/plugins/${pluginId}/test`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    showToast(`✅ Test OK! ${data.message || data.response || 'Plugin merespons baik.'}`, 'success');
                } else {
                    showToast('❌ Test gagal: ' + data.error, 'error');
                }
            } catch (e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        function addAutomationNode(type) {
            const newNode = {
                id: 'n_' + Date.now().toString().slice(-4),
                type: 'condition',
                title: 'Node Filter Baru',
                desc: 'Memeriksa variabel atau kata kunci',
                icon: 'ph-git-branch',
                color: 'blue'
            };
            state.automationNodes.push(newNode);
            saveState();
            renderContent('automation');
            showToast('Node automation baru ditambahkan!', 'success');
        }

        function removeAutomationNode(id) {
            state.automationNodes = state.automationNodes.filter(n => n.id !== id);
            saveState();
            renderContent('automation');
            showToast('Node berhasil dihapus', 'info');
        }

        function runAutomationSimulation() {
            showToast('Menjalankan simulasi workflow...', 'info');
            state.automationNodes.forEach((n, idx) => {
                setTimeout(() => {
                    const el = document.getElementById('node_el_' + n.id);
                    if (el) {
                        el.classList.add('border-emerald-600', 'node-glow');
                        setTimeout(() => el.classList.remove('border-emerald-600', 'node-glow'), 1200);
                    }
                }, idx * 1000);
            });
            setTimeout(() => {
                showToast('Simulasi Selesai! Semua node tereksekusi.', 'success');
            }, state.automationNodes.length * 1000 + 400);
        }

        function selectAiProvider(provider) {
            state.aiConfig.provider = provider;
            if (provider === 'openai') state.aiConfig.model = 'gpt-4o';
            else if (provider === 'gemini') state.aiConfig.model = 'gemini-1.5-pro';
            else if (provider === 'claude') state.aiConfig.model = 'claude-3-5-sonnet';
            saveState();
            renderContent('ai');
        }

        function handleSaveAiConfig(e) {
            e.preventDefault();
            state.aiConfig.model = document.getElementById('aiModelSelect').value;
            state.aiConfig.apiKey = document.getElementById('aiApiKeyInput').value;
            state.aiConfig.systemPrompt = document.getElementById('aiSystemPromptInput').value;
            saveState();
            showToast('Konfigurasi AI Agent disimpan!', 'success');
        }

        function handleSandboxSend(e) {
            e.preventDefault();
            const input = document.getElementById('sandboxInput');
            const val = input.value.trim();
            if (!val) return;

            state.sandboxChat.push({ sender: 'user', text: val });
            input.value = '';
            renderContent('ai');

            setTimeout(() => {
                let botReply = 'Halo! Saya adalah ATSUGA AI Agent. Silakan konfigurasikan API Key Anda di panel sebelah kiri untuk respon AI langsung.';
                if (state.aiConfig.apiKey) {
                    botReply = `[${state.aiConfig.provider.toUpperCase()} - ${state.aiConfig.model}]: Halo! Terima kasih telah menghubungi kami. Ada yang bisa dibantu?`;
                }
                state.sandboxChat.push({ sender: 'bot', text: botReply });
                saveState();
                renderContent('ai');
                const container = document.getElementById('sandboxChatContainer');
                if (container) container.scrollTop = container.scrollHeight;
            }, 600);
        }

            }
            else if (type === 'viewWebhookPayload') {
                const wh = state.webhooks.find(w => w.id === extraData);
                html = `
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="text-base font-extrabold text-slate-900">Payload Webhook #${extraData}</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="ph-bold ph-x text-xl"></i></button>
                    </div>
                    <div class="p-6 space-y-4">
                        <pre class="bg-slate-900 p-4 rounded-xl text-xs font-mono text-emerald-300 overflow-x-auto border border-slate-800">${wh ? wh.payload : '{}'}</pre>
                        <button onclick="copyToClipboard('${wh ? wh.payload.replace(/'/g, "\\'") : ''}')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl py-2 text-xs transition-all">
                            Copy Payload JSON
                        </button>
                    </div>
                `;
            }
            else if (type === 'addContact') {
                html = `
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="text-base font-extrabold text-slate-900">Tambah Kontak Baru</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="ph-bold ph-x text-xl"></i></button>
                    </div>
                    <form onsubmit="handleAddContactSubmit(event)" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Nama Lengkap</label>
                            <input type="text" id="contactNameInput" placeholder="Contoh: Budi Santoso" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 outline-none focus:border-emerald-600" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Nomor WhatsApp</label>
                            <input type="text" id="contactPhoneInput" placeholder="+628123456789" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 outline-none focus:border-emerald-600" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1.5">Tag Segmentasi (Pisahkan dengan koma)</label>
                            <input type="text" id="contactTagsInput" placeholder="VIP, Lead" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-900 outline-none focus:border-emerald-600">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl py-2.5 text-sm transition-all shadow-md shadow-emerald-600/25">
                            Simpan Kontak
                        </button>
                    </form>
                `;
            }
            else if (type === 'importCsv') {
                html = `
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                        <h3 class="text-base font-extrabold text-slate-900">Import Kontak CSV</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700"><i class="ph-bold ph-x text-xl"></i></button>
                    </div>
                    <form onsubmit="handleImportCsvSubmit(event)" class="p-6 space-y-4">
                        <p class="text-xs text-slate-500">Format: <code>Nama, NomorWA, Tag</code> (Satu baris per kontak)</p>
                        <textarea id="csvDataInput" rows="6" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 text-xs text-slate-900 font-mono outline-none focus:border-emerald-600 resize-none" placeholder="Andi,+6281200001,VIP&#10;Bambang,+6281200002,Lead"></textarea>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl py-2.5 text-sm transition-all shadow-md shadow-emerald-600/25">
                            Proses Import
                        </button>
                    </form>
                `;
            }

            content.innerHTML = html;
            overlay.classList.remove('hidden');
            void overlay.offsetWidth;
            overlay.classList.remove('opacity-0');
            content.classList.remove('scale-95');

            if (type === 'addSession') {
                setTimeout(() => startRealQrGeneration(), 150);
            }
        }

        function fillLoginForm(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            closeModal();
            handleLogin(new Event('submit'));
        }

        let qrPollInterval = null;

        function closeModal() {
            if (qrPollInterval) {
                clearInterval(qrPollInterval);
                qrPollInterval = null;
            }
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            overlay.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                overlay.classList.add('hidden');
                content.innerHTML = '';
            }, 200);
        }

        async function startRealQrGeneration() {
            const nameInput = document.getElementById('newSessionName');
            const sessionName = nameInput ? nameInput.value.trim() || 'WhatsApp Utama' : 'WhatsApp Utama';
            const loader = document.getElementById('qrLoader');
            const qrImg = document.getElementById('qrImage');
            const statusText = document.getElementById('qrStatusText');

            if (loader) loader.classList.remove('hidden');
            if (qrImg) { qrImg.classList.add('hidden'); qrImg.src = ''; }
            if (statusText) statusText.innerText = '⏳ Menghubungkan ke WhatsApp... Tunggu sebentar.';

            try {
                const res = await fetch('/api/sessions/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: sessionName })
                });
                const data = await res.json();

                if (data.success) {
                    const sessionId = data.sessionId;
                    if (statusText) statusText.innerText = '🔄 Generating QR Code real dari WhatsApp... Harap tunggu (5-15 detik).';
                    pollQrStatus(sessionId, sessionName);
                } else {
                    if (loader) loader.classList.add('hidden');
                    if (statusText) statusText.innerText = '❌ Gagal membuat sesi: ' + (data.error || 'Server error');
                }
            } catch (err) {
                console.error('API Error:', err);
                if (loader) loader.classList.add('hidden');
                if (statusText) statusText.innerText = '❌ Tidak dapat terhubung ke Backend. Pastikan node server.js berjalan di port 3000.';
            }
        }

        function pollQrStatus(sessionId, sessionName) {
            if (qrPollInterval) clearInterval(qrPollInterval);
            let pollCount = 0;
            const MAX_POLLS = 60; // 60 x 2s = 2 menit timeout

            const fetchQr = async () => {
                pollCount++;
                if (pollCount > MAX_POLLS) {
                    clearInterval(qrPollInterval);
                    qrPollInterval = null;
                    const statusText = document.getElementById('qrStatusText');
                    if (statusText) statusText.innerText = '⏰ Timeout: QR tidak tersedia. Coba tutup dan buka kembali modal.';
                    return;
                }

                try {
                    const res = await fetch(`/api/sessions/${sessionId}/qr`);
                    const data = await res.json();

                    const loader = document.getElementById('qrLoader');
                    const qrImg = document.getElementById('qrImage');
                    const statusText = document.getElementById('qrStatusText');

                    if (data.success) {
                        // ✅ Real QR received from Baileys - display it
                        if (data.qrCodeDataUrl && qrImg) {
                            qrImg.src = data.qrCodeDataUrl;
                            qrImg.classList.remove('hidden');
                            if (loader) loader.classList.add('hidden');
                            if (statusText) statusText.innerText = '✅ QR Code siap! Buka WhatsApp → Perangkat Tertaut → Tautkan Perangkat → Scan QR ini.';
                        } else {
                            // Still waiting for real QR
                            if (statusText) statusText.innerText = `🔄 Menunggu QR dari WhatsApp... (${pollCount * 2}s)`;
                        }

                        if (data.status === 'Connected') {
                            clearInterval(qrPollInterval);
                            qrPollInterval = null;

                            const newSession = {
                                id: sessionId,
                                name: sessionName,
                                phone: data.phone || 'Terhubung',
                                status: 'Connected',
                                battery: 100,
                                lastSeen: 'Just now'
                            };

                            state.sessions = state.sessions.filter(s => s.id !== sessionId);
                            state.sessions.push(newSession);
                            state.stats.totalSessions = state.sessions.length;
                            saveState();

                            closeModal();
                            renderContent('sessions');
                            showToast(`✅ TERHUBUNG! WhatsApp: ${newSession.phone}`, 'success');
                        }
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            };

            fetchQr();
            qrPollInterval = setInterval(fetchQr, 2000);
        }

        function handleAddSessionSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('newSessionName').value;
            const phone = document.getElementById('newSessionPhone').value;
            const newS = {
                id: 'S-' + Math.floor(100 + Math.random() * 900),
                name: name,
                phone: phone,
                status: 'Connected',
                battery: 100,
                lastSeen: 'Just now'
            };
            state.sessions.push(newS);
            state.stats.totalSessions = state.sessions.length;
            saveState();
            closeModal();
            renderContent('sessions');
            showToast(`Device ${name} berhasil dihubungkan!`, 'success');
        }

        function handleAddApiKeySubmit(e) {
            e.preventDefault();
            const name = document.getElementById('keyNameInput').value;
            const newK = {
                id: 'k_' + Date.now().toString().slice(-4),
                name: name,
                key: 'atsuga_live_' + Math.random().toString(36).substring(2, 12),
                created: new Date().toISOString().split('T')[0],
                status: 'Active'
            };
            state.apikeys.push(newK);
            saveState();
            closeModal();
            renderContent('api');
            showToast('API Key baru berhasil dibuat!', 'success');
        }

        function handleAddContactSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('contactNameInput').value;
            const phone = document.getElementById('contactPhoneInput').value;
            const tags = document.getElementById('contactTagsInput').value || 'General';
            const newC = {
                id: 'c_' + Date.now().toString().slice(-4),
                name: name,
                phone: phone,
                tags: tags,
                created: new Date().toISOString().split('T')[0]
            };
            state.contacts.push(newC);
            saveState();
            closeModal();
            renderContent('contacts');
            showToast('Kontak baru ditambahkan!', 'success');
        }

        function handleImportCsvSubmit(e) {
            e.preventDefault();
            const text = document.getElementById('csvDataInput').value;
            const lines = text.split('\n');
            let count = 0;
            lines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    state.contacts.push({
                        id: 'c_' + Date.now().toString().slice(-4) + Math.random().toString(36).substring(2, 5),
                        name: parts[0].trim(),
                        phone: parts[1].trim(),
                        tags: parts[2] ? parts[2].trim() : 'CSV Import',
                        created: new Date().toISOString().split('T')[0]
                    });
                    count++;
                }
            });
            saveState();
            closeModal();
            renderContent('contacts');
            showToast(`Berhasil mengimpor ${count} kontak!`, 'success');
        }

        // Run app on load
        window.onload = initApp;
    </script>
</body>

</html>
